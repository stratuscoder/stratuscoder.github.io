<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="css/gallery.css">
    <!-- Immediately mark as authenticated if session is valid — prevents any flash -->
    <script>
        if (sessionStorage.getItem('gallery_auth') === '1') {
            document.documentElement.classList.add('authenticated');
        }
    </script>
</head>
<body>

<!-- Password overlay -->
<div class="auth-overlay" id="auth-overlay" role="dialog" aria-modal="true" aria-label="Gallery login">
    <div class="auth-card">
        <div class="auth-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <h1 class="auth-title">Family Gallery</h1>
        <p class="auth-subtitle">Enter the password to view the gallery photos</p>

        <form class="auth-form" id="auth-form" novalidate>
            <div class="auth-input-wrap">
                <input
                    class="auth-input"
                    id="auth-input"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    autofocus
                    spellcheck="false"
                >
                <button type="button" class="auth-toggle" id="auth-toggle" aria-label="Show password" tabindex="-1">
                    <!-- Eye icon (show) -->
                    <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <!-- Eye-off icon (hide) -->
                    <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>
            <p class="auth-error" id="auth-error" aria-live="polite"></p>
            <button type="submit" class="auth-submit" id="auth-submit">
                Enter Gallery
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </button>
        </form>
    </div>
</div>

<header class="header">
    <div class="header-inner">
        <div class="header-brand">
            <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span class="brand-name">Gallery</span>
        </div>

        <nav class="header-nav" role="tablist">
            <button class="nav-btn active" id="btn-all" role="tab" aria-selected="true" data-filter="all">
                All
                <span class="count-badge" id="count-all">0</span>
            </button>
            <button class="nav-btn" id="btn-favorites" role="tab" aria-selected="false" data-filter="favorites">
                <svg class="nav-heart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                Favorites
                <span class="count-badge fav-badge" id="count-favorites">0</span>
            </button>
        </nav>

        <div class="header-search">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="search-input" placeholder="Search images…" autocomplete="off" spellcheck="false">
        </div>
    </div>
</header>

<main class="main">
    <div class="gallery-grid" id="gallery-grid" role="list"></div>
    <div class="empty-state" id="empty-state" aria-live="polite">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
        </svg>
        <p class="empty-title" id="empty-title">No images found.</p>
        <p class="empty-hint" id="empty-hint">Add images to the <code>images/</code> folder and run <code>node generate-manifest.js</code></p>
    </div>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true">
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>

    <button class="lightbox-close" id="lightbox-close" aria-label="Close viewer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
    </button>

    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous image">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
    </button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next image">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
        </svg>
    </button>

    <div class="lightbox-stage">
        <div class="lightbox-img-wrap">
            <img class="lightbox-img" id="lightbox-img" src="" alt="">
        </div>
        <div class="lightbox-footer">
            <div class="lightbox-info">
                <span class="lightbox-title" id="lightbox-title"></span>
                <span class="lightbox-counter" id="lightbox-counter"></span>
            </div>
            <div class="lightbox-actions">
                <button class="lightbox-fav-btn" id="lightbox-fav-btn" aria-label="Toggle favorite">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </button>
                <a class="lightbox-download-btn" id="lightbox-download-btn" href="" download="">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download
                </a>
            </div>
        </div>
    </div>
</div>

<script src="js/images-data.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
